server:
  port: 8082

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/accountdb
    username: ${DB_USER:banking}
    password: ${DB_PASSWORD:banking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32b}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
