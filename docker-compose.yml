version: "3.9"

x-jwt-secret: &jwt-secret ${JWT_SECRET:-change-me-change-me-change-me-change-me-32b}

services:

  postgres:
    image: postgres:16-alpine
    container_name: banking-postgres
    environment:
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: banking-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: banking-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 15

  customer-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: customer-service
    container_name: banking-customer-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: banking
      DB_PASSWORD: banking
      JWT_SECRET: *jwt-secret
    depends_on:
      postgres:
        condition: service_healthy

  account-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: account-service
    container_name: banking-account-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: banking
      DB_PASSWORD: banking
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: *jwt-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  transaction-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: transaction-service
    container_name: banking-transaction-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: banking
      DB_PASSWORD: banking
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ACCOUNT_SERVICE_HOST: account-service
      ACCOUNT_SERVICE_PORT: 8082
      JWT_SECRET: *jwt-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: notification-service
    container_name: banking-notification-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: banking
      DB_PASSWORD: banking
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: *jwt-secret
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: api-gateway
    container_name: banking-api-gateway
    ports:
      - "8080:8080"
    environment:
      CUSTOMER_SERVICE_URI: http://customer-service:8081
      ACCOUNT_SERVICE_URI: http://account-service:8082
      TRANSACTION_SERVICE_URI: http://transaction-service:8083
      NOTIFICATION_SERVICE_URI: http://notification-service:8084
      JWT_SECRET: *jwt-secret
    depends_on:
      - customer-service
      - account-service
      - transaction-service
      - notification-service

volumes:
  postgres-data:
